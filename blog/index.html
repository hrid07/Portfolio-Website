<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="blog.css">
    <title>Hrid's Blog - Tech Insights</title>
</head>

<body>
    <header>
        <a href="../index.html" class="logo">Hrid</a>
        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="index.html" class="active">Blog</a>
        </nav>
        <div class="menu-icon" id="menu-icon">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <main class="blog-home">
        <section class="blog-hero">
            <h1>Technical <span>Blog</span></h1>
            <p>Exploring software development, AI, and systems engineering.</p>
        </section>

        <section class="blog-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="blog-search" placeholder="Search articles..." oninput="filterPosts()">
            </div>
            <div class="tag-filters" id="tag-filters">
                <button class="tag-btn active" onclick="filterByTag('All')">All</button>
                <button class="tag-btn" onclick="filterByTag('Java')">Java</button>
                <button class="tag-btn" onclick="filterByTag('C++')">C++</button>
                <button class="tag-btn" onclick="filterByTag('AI')">AI</button>
                <button class="tag-btn" onclick="filterByTag('System Design')">System Design</button>
            </div>
        </section>

        <section class="blog-grid" id="blog-grid">
            <!-- Blog cards will be injected here -->
        </section>
    </main>

    <footer class="blog-footer">
        <p>&copy; 2026 Hrid Raian Khan. All rights reserved.</p>
    </footer>

    <script src="blog.js"></script>
</body>

</html>
